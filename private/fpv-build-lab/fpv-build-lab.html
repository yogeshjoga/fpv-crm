<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPV Build Lab — 5-inch Freestyle Quad</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f1ef; --panel:#ffffff; --ink:#17181a; --muted:#6b7075;
    --line:#e2e2de; --line-soft:#eeeeeb;
    --accent:#0f7a80; --accent-soft:#e6f1f1; --warn:#8a6224; --warn-soft:#f6efe2;
    --sans:"Archivo",system-ui,sans-serif; --serif:"Newsreader",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  a:hover{color:#0b5d61}
  three-d-stage:not(:defined){visibility:hidden}
  button{font:inherit;color:inherit;cursor:pointer}

  .app{display:grid;grid-template-rows:auto 1fr;height:100%}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:24px;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:12px;min-width:0}
  .brand h1{font:500 25px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
  .brand span{font:400 11px/1 var(--mono);letter-spacing:.10em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .hgap{flex:1}
  .modes{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:var(--r);border:1px solid var(--line)}
  .modes button{border:0;background:transparent;border-radius:7px;padding:7px 14px;font-size:13.5px;color:var(--muted)}
  .modes button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07);font-weight:500}
  .prog{display:flex;align-items:center;gap:10px;font:400 12px/1 var(--mono);color:var(--muted)}
  .bar{width:118px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}

  /* ---------- layout ---------- */
  .grid{display:grid;grid-template-columns:320px minmax(0,1fr) 340px;gap:16px;padding:16px;min-height:0}
  @media (max-width:1180px){
    .grid{grid-template-columns:minmax(0,1fr) 320px;overflow:auto;grid-auto-rows:min-content;align-items:start}
    .stagewrap{align-self:start;height:min(480px,62vh)}
    .col-info{max-height:min(480px,62vh)}
    .col-steps{max-height:340px}
    .col-steps{grid-column:1/-1;order:3}
    .stagewrap{order:1}
    .col-info{order:2}
  }
  @media (max-width:820px){
    .grid{grid-template-columns:minmax(0,1fr)}
    .stagewrap{min-height:min(420px,58vh)}
  }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
  .col{display:flex;flex-direction:column;gap:16px;min-height:0}
  .scroll{overflow:auto;min-height:0}
  .ttl{font:400 11px/1 var(--mono);letter-spacing:.10em;text-transform:uppercase;color:var(--muted);padding:16px 18px 10px;border-bottom:1px solid var(--line-soft)}

  /* ---------- steps ---------- */
  .steps{list-style:none;margin:0;padding:8px}
  .steps li{display:flex;gap:11px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer}
  .steps li:hover{background:var(--bg)}
  .steps li[aria-current="true"]{background:var(--accent-soft)}
  .steps .n{flex:0 0 22px;height:22px;border-radius:99px;border:1px solid var(--line);display:grid;place-items:center;font:400 11px/1 var(--mono);color:var(--muted);background:var(--panel);margin-top:1px}
  .steps li[aria-current="true"] .n{border-color:var(--accent);color:var(--accent)}
  .steps li.done .n{background:var(--accent);border-color:var(--accent);color:#fff}
  .steps .lb{font-size:14.5px;line-height:1.35}
  .steps .sub{display:block;font:400 11.5px/1.3 var(--mono);color:var(--muted);margin-top:3px}
  .steps li.part .n{border-radius:5px;font-size:10px}
  .steps li.part[aria-pressed="true"]{background:var(--accent-soft)}
  .steps li.part[aria-pressed="true"] .n{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---------- stage ---------- */
  .stagewrap{position:relative;border-radius:var(--r);border:1px solid var(--line);background:#fafaf9;overflow:hidden;min-height:min(480px,62vh)}
  three-d-stage{width:100%;height:100%;display:block}
  .overlay{position:absolute;inset:0;pointer-events:none}
  .lbl{position:absolute;display:none;transform:translate(-50%,-50%);white-space:nowrap;font:400 11px/1 var(--mono);letter-spacing:.02em;background:rgba(255,255,255,.92);border:1px solid var(--line);color:var(--ink);padding:4px 7px;border-radius:5px;pointer-events:auto;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .lbl.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .stagebar{position:absolute;left:14px;top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none;max-width:calc(100% - 28px)}
  .stagebar > *{pointer-events:auto}
  .pill{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:99px;padding:8px 14px;display:flex;align-items:center;gap:10px;font:400 12px/1 var(--mono);color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .pill input[type=range]{width:120px;accent-color:var(--accent)}
  .pill[hidden]{display:none}
  .pill.live{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---------- info panel ---------- */
  .tabs{display:flex;gap:2px;padding:8px 8px 0}
  .tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:8px 8px 0 0;font-size:13.5px;color:var(--muted)}
  .tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .pane{padding:16px 18px 20px}
  .pane h2{font:500 24px/1.2 var(--serif);margin:2px 0 8px;letter-spacing:-.01em}
  .pane h3{font:500 17px/1.3 var(--serif);margin:20px 0 6px}
  .pane p{margin:0 0 11px;color:#31343a;text-wrap:pretty}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font:400 12.5px/1.5 var(--mono);margin:12px 0 2px;padding-top:12px;border-top:1px solid var(--line-soft)}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0}
  .note{border-left:2px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 6px 6px 0;font-size:13.5px;margin:12px 0 0;color:#4a3c1d}
  .note b{font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;font:400 12px/1.3 var(--mono);color:var(--muted)}
  .chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 15px;font-size:13.5px}
  .btn:hover{border-color:#c9c9c4}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{background:#0b5d61}
  ul.plain{margin:6px 0 0;padding-left:18px;color:#31343a}
  ul.plain li{margin-bottom:5px}

  /* ---------- quiz ---------- */
  .q{margin:0 0 22px;padding-bottom:18px;border-bottom:1px solid var(--line-soft)}
  .q:last-child{border:0}
  .q .qn{font:400 11px/1 var(--mono);color:var(--muted);letter-spacing:.08em}
  .q p{margin:7px 0 10px;font-size:14.5px}
  .opts{display:flex;flex-direction:column;gap:6px}
  .opt{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 12px;font-size:13.5px}
  .opt:hover{border-color:#c9c9c4}
  .opt.good{border-color:var(--accent);background:var(--accent-soft);color:#0b5d61}
  .opt.bad{border-color:#b5544a;background:#f8ecea;color:#8a3a31}
  .fb{font:400 12.5px/1.5 var(--mono);color:var(--muted);margin-top:9px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>FPV Build Lab</h1>
      <span>5-inch freestyle quad · 220&nbsp;mm</span>
    </div>
    <div class="hgap"></div>
    <div class="modes" id="modes">
      <button data-mode="assembled" aria-pressed="true">Assembled</button>
      <button data-mode="exploded" aria-pressed="false">Exploded</button>
      <button data-mode="wiring" aria-pressed="false">Wiring</button>
    </div>
    <div class="prog">
      <span id="progTxt">0 / 13</span>
      <span class="bar"><i id="progBar"></i></span>
    </div>
  </header>

  <div class="grid">
    <div class="col col-steps">
      <div class="card scroll">
        <div class="tabs" id="railTabs">
          <button data-rail="steps" aria-pressed="true">Build sequence</button>
          <button data-rail="parts" aria-pressed="false">Parts library</button>
        </div>
        <ol class="steps" id="stepList"></ol>
      </div>
    </div>

    <div class="stagewrap">
      <three-d-stage id="stage" name="fpv-5inch-quad" background="#fafaf9"></three-d-stage>
      <div class="overlay" id="labels"></div>
      <div class="stagebar">
        <span class="pill">Explode
          <input type="range" id="explode" min="0" max="100" value="0" aria-label="Explode amount">
        </span>
        <span class="pill"><button class="btn" id="labelToggle" style="border:0;background:none;padding:0" aria-pressed="false">Labels: off</button></span>
        <span class="pill"><button class="btn" id="reset" style="border:0;background:none;padding:0">Show all parts</button></span>
        <span class="pill" id="quizBar" hidden></span>
        <span class="pill" id="soloBar" hidden><button class="btn" id="exitSolo" style="border:0;background:none;padding:0">← Back to full assembly</button></span>
      </div>
    </div>

    <div class="col col-info">
      <div class="card scroll">
        <div class="tabs" id="tabs">
          <button data-tab="lesson" aria-pressed="true">Lesson</button>
          <button data-tab="part" aria-pressed="false">Part card</button>
          <button data-tab="quiz" aria-pressed="false">Check</button>
        </div>
        <div class="pane" id="pane"></div>
      </div>
    </div>
  </div>
</div>

<script src="./three-d-stage.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
